# What tools/preview.py shows (docs/PREVIEW.md): the aircraft in the air around a place in west London one evening,
# as adsb.lol gave them (trimmed to the fields the fetch maps), and the route, type and photo answers of the
# nearest ones as adsbdb and planespotters gave them. The photos are drawn by the bench: none is stored here.
tiles:
  - tile: radar
    name: Overhead
    options: { place: zone.home, range: "13" }
    sizes: [1x1, 2x1, 1x2, 2x2, 3x2, 4x3]
  - tile: radar
    name: Tap through
    options: { place: zone.home, range: "13" }
    sizes: [2x2]
    then: [[0.5, 0.69]]
  - tile: radar
    name: Aviation units
    options: { place: zone.home, range: "13", units: aviation }
    sizes: [2x1]

states:
  zone.home: { state: "0", attributes: { latitude: 51.47, longitude: -0.32, radius: 100, friendly_name: Home } }

